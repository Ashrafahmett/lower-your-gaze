<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Blocked</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1f2a24; --muted:#66706a; --accent:#2f6f4f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a1f1c; --fg:#e8ebe8; --muted:#9aa49e; --accent:#5fb48a; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; text-align:center; padding:16px; box-sizing:border-box; }
  h1 { color:var(--accent); font-size:24px; margin:0 0 8px; }
  p { color:var(--muted); margin:4px 0; }
  .ayah { font-size:22px; margin:24px 0 4px; color:var(--fg); }
</style>
</head>
<body>
  <main>
    <h1>This site is blocked</h1>
    <p>Endless short videos waste time and show things we should not see.</p>
    <p class="ayah" dir="rtl" lang="ar">قُل لِّلْمُؤْمِنِينَ يَغُضُّوا مِنْ أَبْصَارِهِمْ</p>
    <p>"Tell the believing men to lower their gaze." (An-Nur 24:30)</p>
  </main>
</body>
</html>
