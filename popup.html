<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fbfaf7; --fg:#1f2a24; --muted:#66706a; --line:#e2e0d8; --accent:#2f6f4f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a1f1c; --fg:#e8ebe8; --muted:#9aa49e; --line:#2f3732; --accent:#5fb48a; } }
  body { margin:0; width:290px; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 16px 10px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  h1 { font-size:15px; margin:0; }
  section { padding:12px 16px; border-bottom:1px solid var(--line); }
  label.row { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:6px 0; }
  select, button { font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  button { cursor:pointer; width:100%; padding:7px; }
  button.on { border-color:var(--accent); color:var(--accent); }
  .hint { color:var(--muted); font-size:12px; margin:4px 0 0; }
  .switch { position:relative; width:40px; height:22px; }
  .switch input { opacity:0; width:0; height:0; }
  .switch span { position:absolute; inset:0; background:var(--line); border-radius:22px; transition:.15s; }
  .switch span::after { content:''; position:absolute; left:3px; top:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:.15s; }
  .switch input:checked + span { background:var(--accent); }
  .switch input:checked + span::after { transform:translateX(18px); }
</style>
</head>
<body>
  <header>
    <h1>Modest Blur</h1>
    <label class="switch" title="On / off"><input type="checkbox" id="enabled"><span></span></label>
  </header>
  <section>
    <label class="row">Strictness
      <select id="mode">
        <option value="strict">Strict</option>
        <option value="normal">Normal</option>
        <option value="all">Blur every image</option>
      </select>
    </label>
    <p class="hint" id="modeHint"></p>
    <label class="row">Videos
      <select id="videos">
        <option value="scan">Check while playing</option>
        <option value="block">Always blur</option>
      </select>
    </label>
  </section>
  <section>
    <label class="row">Hide YouTube Shorts <input type="checkbox" data-key="shorts"></label>
    <label class="row">Hide YouTube home feed &amp; “up next” <input type="checkbox" data-key="ytRecs"></label>
    <label class="row">Hide Instagram Reels &amp; Explore <input type="checkbox" data-key="igReels"></label>
    <label class="row">Hide Facebook Reels &amp; Watch <input type="checkbox" data-key="fbReels"></label>
    <label class="row">Hide X home feed, Explore &amp; trends <input type="checkbox" data-key="xFeed"></label>
    <label class="row">Block TikTok <input type="checkbox" data-key="tiktok"></label>
  </section>
  <section>
    <button id="site"></button>
    <p class="hint">Right-click any blurred image → “Modest Blur: show this one” to show just that image.</p>
  </section>
  <script src="popup.js"></script>
</body>
</html>
